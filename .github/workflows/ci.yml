name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q "dist/extension/entry.js" /tmp/pack.txt
          grep -q "README.md" /tmp/pack.txt
          test -f dist/extension/entry.js
          test -f dist/extension/subagent-entry.js
          if grep -q "dist/host/" /tmp/pack.txt || grep -q "dist/contracts/" /tmp/pack.txt; then
            echo "host/contracts 已随 PiDeck 移除，不应出现在发布包中"
            exit 1
          fi
          echo "package layout OK"
