name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | grep -E "Tarball Contents|dist/extension/entry.js|dist/host/index.js|dist/contracts/index.js|README.md|models.json" || true
          test -f dist/extension/entry.js
          test -f dist/host/index.js
          test -f dist/contracts/index.js
          echo "package layout OK"
