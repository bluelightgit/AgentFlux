name: Live E2E

# 真实模型链路测试。仅在推送到 main 或手动触发时运行。
# 触发方式：
#   1. 推送到 main：使用仓库 Secrets 中的 provider 参数
#   2. 手动 workflow_dispatch：可在 Actions 页面覆盖 provider 参数
#
# provider 参数与 pi models.json 的 providers 段一一对应
# （参考 pi docs/models.md；tests/live/live-config.ts 会生成临时 agent 目录）：
#   base-url    → providers.<id>.baseUrl
#   api-type    → providers.<id>.api（openai-completions 等）
#   api-key     → providers.<id>.apiKey（也可用 $ENV 引用或 --api-key）
#   model-*     → providers.<id>.models[].id
#   thinking    → pi CLI 的 --thinking 等级
#
# 需要配置的 Secrets（push 触发使用；手动触发时可用 inputs 替代）：
#   AGENTFLUX_LIVE_BASE_URL / AGENTFLUX_LIVE_API_KEY
#   AGENTFLUX_LIVE_MODEL_PRO / AGENTFLUX_LIVE_MODEL_FLASH

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base-url:
        description: "Provider base URL（对应 models.json providers.<id>.baseUrl）"
        required: true
        type: string
      api-key:
        description: "API key（会被日志打码；也可省略改用 Secrets.AGENTFLUX_LIVE_API_KEY）"
        required: false
        type: string
      api-type:
        description: "API 类型：openai-completions / openai-responses / anthropic-messages 等"
        required: false
        default: openai-completions
        type: string
      provider-id:
        description: "provider id（默认 agentflux-ci）"
        required: false
        default: agentflux-ci
        type: string
      model-pro:
        description: "高能力模型名（planner/reviewer 等角色）"
        required: true
        type: string
      model-flash:
        description: "低能力模型名（implementer/tester 等角色）"
        required: true
        type: string
      thinking:
        description: "思考等级：off / minimal / low / medium / high / xhigh / max"
        required: false
        default: off
        type: string
      cases:
        description: "Cases: direct,agents,workflow,community,history,workflow-reuse,workflow-modify"
        required: false
        default: direct,agents,workflow,community
        type: string

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [process, sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Mask API key
        env:
          KEY: ${{ inputs.api-key || secrets.AGENTFLUX_LIVE_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "::add-mask::$KEY"; fi

      - name: Run live tests
        env:
          AGENTFLUX_LIVE_BASE_URL: ${{ inputs.base-url || secrets.AGENTFLUX_LIVE_BASE_URL }}
          AGENTFLUX_LIVE_API_KEY: ${{ inputs.api-key || secrets.AGENTFLUX_LIVE_API_KEY }}
          AGENTFLUX_LIVE_API: ${{ inputs.api-type || 'openai-completions' }}
          AGENTFLUX_LIVE_PROVIDER_ID: ${{ inputs.provider-id || 'agentflux-ci' }}
          AGENTFLUX_LIVE_PROFILE: environment
          AGENTFLUX_LIVE_BUILT: "1"
          AGENTFLUX_LIVE_RUNTIME: ${{ matrix.runtime }}
          AGENTFLUX_LIVE_MODEL: ${{ inputs.model-pro || secrets.AGENTFLUX_LIVE_MODEL_PRO }}
          AGENTFLUX_LIVE_PLANNER_MODEL: ${{ inputs.model-pro || secrets.AGENTFLUX_LIVE_MODEL_PRO }}
          AGENTFLUX_LIVE_WORKER_MODEL: ${{ inputs.model-flash || secrets.AGENTFLUX_LIVE_MODEL_FLASH }}
          AGENTFLUX_LIVE_JUDGE_MODEL: ${{ inputs.model-pro || secrets.AGENTFLUX_LIVE_MODEL_PRO }}
          AGENTFLUX_LIVE_THINKING: ${{ inputs.thinking || secrets.AGENTFLUX_LIVE_THINKING || 'off' }}
          LIVE_CASES: ${{ inputs.cases || 'direct,agents,workflow,community' }}
        run: |
          test -n "$AGENTFLUX_LIVE_BASE_URL" || { echo "缺少 base-url"; exit 1; }
          test -n "$AGENTFLUX_LIVE_API_KEY" || { echo "缺少 api-key"; exit 1; }
          test -n "$AGENTFLUX_LIVE_MODEL" || { echo "Missing model-pro"; exit 1; }
          test -n "$AGENTFLUX_LIVE_WORKER_MODEL" || { echo "Missing model-flash"; exit 1; }
          echo "provider=$AGENTFLUX_LIVE_PROVIDER_ID api=$AGENTFLUX_LIVE_API runtime=$AGENTFLUX_LIVE_RUNTIME"
          echo "modelPro=$AGENTFLUX_LIVE_MODEL modelFlash=$AGENTFLUX_LIVE_WORKER_MODEL thinking=$AGENTFLUX_LIVE_THINKING"
          CASES="$LIVE_CASES"
          echo "cases=$CASES"
          FAILED=0
          for case in $(echo "$CASES" | tr ',' ' '); do
            echo "=== case: $case ==="
            case "$case" in
              direct|agents|workflow|community)
                AGENTFLUX_LIVE_CASES="$case" npm run test:live || FAILED=1 ;;
              history)
                npm run test:live:history || FAILED=1 ;;
              workflow-reuse)
                npm run test:live:workflow-reuse || FAILED=1 ;;
              workflow-modify)
                npm run test:live:workflow-modify || FAILED=1 ;;
              *)
                echo "unknown case: $case"; FAILED=1 ;;
            esac
          done
          exit $FAILED

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentflux-live-report-${{ matrix.runtime }}
          path: .agentflux/test-results/
          if-no-files-found: ignore
